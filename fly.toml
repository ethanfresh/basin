# The store ships inside the image, not on a volume: it is ~15MB of facts and
# citations, built on a workstation by scripts/build_serving_store.py. Nothing
# here is stateful, so a deploy is the whole update mechanism -- see
# docs/deploy.md.
app = "basin"
primary_region = "iad"

[build]

[env]
  # Consumed by basin.store.db.DEFAULT_DB_PATH, which every script and the web
  # app read. Not a secret: it is a path.
  BASIN_DB = "/app/serving.db"
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  # Every machine carries its own copy of the store, so this scales out and
  # across regions freely. 0 trades a cold start for not paying to sit idle.
  min_machines_running = 0

  # A real query, not HEAD /: with the store in the image there is no window
  # where the app is up but has no data, so the check can afford to prove the
  # store opens rather than only that the process is listening.
  [[http_service.checks]]
    method = "GET"
    path = "/api/cohorts"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
