[project]
name = "basin"
version = "0.1.0"
description = "Peer-comparable financial data for US oil & gas producers, extracted from SEC filings, with a citation behind every number."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pillow>=10.0",   # scripts/make_assets.py only
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# schema.sql and web/static/ live inside the package directory, so this picks
# them up already. They were also listed under force-include, which made a
# non-editable `pip install .` fail outright on the duplicate path -- invisible
# locally, where the install is editable and no wheel is ever built.
packages = ["src/basin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
