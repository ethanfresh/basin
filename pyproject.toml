[project]
name = "basin"
version = "0.1.0"
description = "Peer-comparable financial data for US oil & gas producers, extracted from SEC filings, with a citation behind every number."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
