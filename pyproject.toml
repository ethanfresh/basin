[project]
name = "basin"
version = "0.1.0"
description = "Peer-comparable financial data for US oil & gas producers, extracted from SEC filings, with a citation behind every number."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pillow>=10.0",   # scripts/make_assets.py only
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basin"]

[tool.hatch.build.targets.wheel.force-include]
"src/basin/store/schema.sql" = "basin/store/schema.sql"
"src/basin/web/static" = "basin/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
